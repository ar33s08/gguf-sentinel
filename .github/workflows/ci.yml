name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install test dep (the package itself has none)
        run: python -m pip install --upgrade pip pytest
      - name: vendored-source audit (digest + derivation integrity)
        run: python tools/audit.py
      - name: gate (compile / import / behavioural probes / mutation roundtrip)
        run: python tools/gate.py
      - name: pytest
        run: python -m pytest tests -q
      - name: dep-free suite entry point
        run: python tests/run_all.py
      - name: demo fixtures self-verify (README reproducibility contract)
        run: python tools/make_demo.py
      - name: fixture demo scans as documented
        run: |
          python -m sentinel.cli scan fixtures/demo.gguf
          ! python -m sentinel.cli scan fixtures/demo-broken.gguf
      - name: cli smoke (generate then scan clean, exit 0)
        run: |
          python -m sentinel.cli generate --out /tmp/demo.gguf --blocks 2
          python -m sentinel.cli scan /tmp/demo.gguf
